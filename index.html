<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlancePulse — Even G2 Crypto & Prediction Market HUD</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>GlancePulse <span class="badge">Even G2 · 576×288</span></h1>
          <p class="subtitle">
            Live Hyperliquid Perpetuals &amp; Polymarket Odds · 1-Tap R1 Ring Read+Write Execution
          </p>
        </div>
        <div id="mode-pill" class="pill">Connecting…</div>
      </header>

      <main class="stage">
        <section class="glasses-shell">
          <div class="glasses-label">EVEN G2 MONOCHROME GREEN DISPLAY (576 × 288 px)</div>
          <div id="g2-screen" class="g2-screen" role="region" aria-label="Even G2 Display"></div>
          <div class="ring-controls">
            <button id="btn-up" class="ring-btn">▲ Ring Up (↑)</button>
            <button id="btn-down" class="ring-btn">▼ Ring Down (↓)</button>
            <button id="btn-tap" class="ring-btn primary">● Tap / Confirm (Enter)</button>
            <button id="btn-positions" class="ring-btn">≡ Positions (P)</button>
            <button id="btn-feed" class="ring-btn">⇄ Switch Feed (F)</button>
            <button id="btn-refresh" class="ring-btn">↻ Refresh (R)</button>
          </div>
        </section>

        <aside class="ledger-panel">
          <h2>Execution Ledger &amp; Live Alerts</h2>
          <div id="portfolio-summary" class="summary-grid"></div>
          <h3>Orders (Paper / Testnet Execution)</h3>
          <div id="orders-list" class="log-list"></div>
          <h3>Active Price / Odds Alerts</h3>
          <div id="alerts-list" class="log-list"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
